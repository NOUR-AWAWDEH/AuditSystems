services:
  auditsystem.host:
    image: nourawawdeh/auditsystem:latest
    build:
      context: .
      dockerfile: .\source\server\Infrastructure\AuditSystem.Host\Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES}
      - APP_DOMAIN=${APP_DOMAIN}
      - APP_LOGGING_PATH=${APP_LOGGING_PATH}
      - APP_EMAIL_CONFIRMATION=confirm-email?uid={0}&token={1}
      - SMTP_SENDER_ADDRESS=${SMTP_SENDER_ADDRESS}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_ENABLE_SSL=${SMTP_ENABLE_SSL}
      - FILE_STORAGE_BASE_URL=${FILE_STORAGE_BASE_URL}
      - FILESTORAGE_UPLOADPATH=${FILESTORAGE_UPLOADPATH}
