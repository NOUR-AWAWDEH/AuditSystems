services:
  auditsystem.host:
    image: ${DOCKER_REGISTRY-}auditsystemhost
    build:
      context: .
      dockerfile: src/server/Infrastructure/AuditSystem.Host/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=Server=sqlserver;Database=AuditSystemDb;User ID=sa;Password=Havana123%100;Encrypt=True;TrustServerCertificate=True
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Havana123%100
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
