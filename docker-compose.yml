version: "3.9"

services:
  auditsystem.db:
    image: postgres:16
    container_name: auditsystem.db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Havana123!
      POSTGRES_DB: auditsystemdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auditsystem.host:
    image: nourawawdeh/auditsystem:latest
    container_name: auditsystem.host
    build:
      context: .
      dockerfile: ./source/server/Infrastructure/AuditSystem.Host/Dockerfile
    ports:
      - "80:80"
    environment:
      APP_DOMAIN: http://localhost
      APP_EMAIL_CONFIRMATION: confirm-email?uid={0}&token={1}
      APP_LOGGING_PATH: /logs/AuditSystem
      ASPNETCORE_ENVIRONMENT: Development

      DB_CONNECTION_STRING: Host=auditsystem.db;Port=5432;Database=auditsystemdb;Username=postgres;Password=Havana123!
      DB_PASSWORD: Havana123!

      FILE_STORAGE_BASE_URL: http://localhost/
      FILESTORAGE_UPLOADPATH: ../../uploads

      JWT_AUDIENCE: http://localhost
      JWT_EXPIRATION_MINUTES: 60
      JWT_ISSUER: http://localhost
      JWT_KEY: AAAAAzxAAAAAAAAAAASuperSecresasdwfasdadasfasftKeyForJdwtAuth123aaas4asd43645867ituykjhlyuk57434423r435y6768k6umntbvrr34567645e4567890765e

      SIGNED_URL_SECRET_KEY: Q1WrW0CJ7GcbASej53hjPj1agkasd9870754s

      SMTP_ENABLE_SSL: "true"
      SMTP_HOST: smtp.gmail.com
      SMTP_PASSWORD: hqus qaaq dipe cqbm
      SMTP_PORT: 587
      SMTP_SENDER_ADDRESS: auditsstm@gmail.com
      SMTP_SENDER_NAME: Audit System Team
      SMTP_USERNAME: auditsstm@gmail.com

      CORS_ALLOWED_ORIGIN: http://localhost:3000

      ADMIN_INITIAL_EMAIL: admin@auditsystem.online
      ADMIN_INITIAL_PASSWORD: Havana123%100
      ADMIN_INITIAL_USERNAME: nour
      ADMIN_INITIAL_COMPANY_ID: d2719f8e-8b4f-4c0e-a6b8-123456789abc
    depends_on:
      auditsystem.db:
        condition: service_healthy

  auditsystem.client:
    image: nourawawdeh/auditsystemclient:latest
    container_name: auditsystem.client
    build:
      context: ./source/client/auditsystemclient
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost
    ports:
      - "3000:10000"
    environment:
      VITE_API_URL: http://localhost
    depends_on:
      - auditsystem.host

volumes:
  pgdata: