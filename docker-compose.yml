version: '3.8'

services:
  api:
    image: nourawawdeh/auditsystem
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default="Server=db;Database=AuditSystem;User=sa;Password=Havana123%100;Encrypt=True;TrustServerCertificate=True;"
    env_file:
      - ./src/server/Infrastructure/AuditSystem.Host/.env
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Havana123%100
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata: