[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[program:sqlserver]
command=/opt/mssql/bin/sqlservr
startsecs=10
autostart=true
autorestart=true
stderr_logfile=/var/log/sqlserver.err.log
stdout_logfile=/var/log/sqlserver.out.log

[program:aspnet]
command=dotnet /app/AuditSystem.Host.dll
startsecs=10
autostart=true
autorestart=true
stderr_logfile=/var/log/aspnet.err.log
stdout_logfile=/var/log/aspnet.out.log